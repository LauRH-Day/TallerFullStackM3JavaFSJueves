
<section class="registro-page">
  <div class="registro-card">
    <h1>Crear cuenta</h1>
    <p>Regístrate en Llave Maestra para alquilar herramientas.</p>

    <form (ngSubmit)="registrarse()">
      <label for="nombre">Nombre completo</label>
      <input
        id="nombre"
        name="nombre"
        type="text"
        [(ngModel)]="nombre"
        required
      />

      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
      />

      <label for="confirmarPassword">Confirmar contraseña</label>
      <input
        id="confirmarPassword"
        name="confirmacion"
        type="password"
        [(ngModel)]="confirmarPassword"
        required
      />

      @if (errores().length > 0) {
        <ul class="errores" data-testid="errores-registro">
          @for (mensaje of errores(); track mensaje) {
            <li>{{ mensaje }}</li>
          }
        </ul>
      }

      <button type="submit" [disabled]="auth.cargando()">
        {{ auth.cargando() ? 'Registrando...' : 'Crear cuenta' }}
      </button>

      @if (auth.error()) {
        <p class="error-servidor" data-testid="error-registro">
          {{ auth.error() }}
        </p>
      }
    </form>

    <p class="enlace-login">
      ¿Ya tienes cuenta?
      <a href="/login">Inicia sesión</a>
    </p>
  </div>
</section>
