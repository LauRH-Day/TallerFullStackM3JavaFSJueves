@if (authService.sesionActiva()) {
  <header class="barra-navegacion">
    <a class="marca" routerLink="/herramientas">
      <span class="marca-icono">LM</span>
      <span>Llave Maestra</span>
    </a>

    <nav class="menu-principal">
      <a
        routerLink="/herramientas"
        routerLinkActive="seleccionado"
        data-testid="menu-herramientas">
        Herramientas
      </a>
      <a
        *appSiPuede="'ALQUILERES_VER_PROPIOS'"
        routerLink="/mis-alquileres"
        routerLinkActive="seleccionado"
        data-testid="menu-mis-alquileres">
        Mis alquileres
      </a>
      <a
      *appSiPuede="'ALQUILERES_VER_TODOS'"
      routerLink="/alquileres"
      routerLinkActive="seleccionado"
      data-testid="menu-alquileres">
      Alquileres
    </a>
    
    <a
      *appSiPuede="'REPORTES_VER'"
      routerLink="/panel"
      routerLinkActive="seleccionado"
      data-testid="menu-panel">
      Panel
    </a>
      @if (authService.rol() === 'ADMIN') {
        <a
          routerLink="/clientes"
          routerLinkActive="seleccionado"
          data-testid="menu-clientes">
          Clientes
        </a>
      }
    </nav>

    <div class="usuario-menu">
      <span data-testid="nombre-usuario">
        {{ authService.nombre() }}
      </span>

      <button
        type="button"
        data-testid="cerrar-sesion"
        (click)="authService.cerrarSesion()">
        Cerrar sesión
      </button>
    </div>
  </header>
}

<main class="contenido-principal">
  <router-outlet />
</main>
